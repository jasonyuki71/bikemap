<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bikemap</title>
        <link rel="stylesheet" href="global.css" />
        <link rel="stylesheet" href="map.css" />
        <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
        <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
        <script src="map.js" type="module"></script>
        </head>
<body>
    <header>
        <h1>🚴 Bikemap</h1>
        <label>
            Filter by time:
            <input
                id="time-slider"
                type="range"
                min="-1"
                max="1440"
                step="1"
                value="-1"
            />
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
        </label>
    </header>
    <p>Explore bike traffic across Boston and Cambridge.</p>
    <div id="map">
    <svg></svg>
    </div>
    <div class="legend" aria-label="Station traffic flow">
        <span><i class="swatch arrivals"></i> Mostly arrivals</span>
        <span><i class="swatch balanced"></i> Balanced</span>
        <span><i class="swatch departures"></i> Mostly departures</span>
</div>
</body>
</html>
